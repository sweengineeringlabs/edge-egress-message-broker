[package]
name         = "swe-edge-egress-message-publisher"
version      = "0.3.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge"
description  = "edge — egress message publisher: injection-only MessagePublisher port."
keywords     = ["message-broker", "pubsub", "egress", "nats", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "transport"

[lib]
name = "swe_edge_egress_message_publisher"
path = "main/src/lib.rs"

[dependencies]
thiserror   = "2"
futures     = "0.3"
tokio       = { version = "1.0", features = ["rt", "sync"] }
tracing     = { version = "0.1", default-features = false }
serde       = { version = "1.0", features = ["derive"] }
# Contract: the MessagePublisher port speaks the broker vocabulary (Message,
# BrokerError) owned by edge-message-broker — always present.
swe-edge-message-broker  = { git = "https://github.com/sweengineeringlabs/edge-message-broker.git", tag = "v0.3.0" }
swe-edge-configbuilder   = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }

[dev-dependencies]
tokio              = { version = "1.0", features = ["rt-multi-thread", "macros"] }
futures            = "0.3"
swe-edge-configbuilder  = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }
swe-edge-message-broker = { git = "https://github.com/sweengineeringlabs/edge-message-broker.git", tag = "v0.3.0" }

[[example]]
name = "publish"
path = "examples/publish.rs"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
